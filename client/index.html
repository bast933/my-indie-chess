<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chess-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    
    <!-- SEO Meta Tags -->
    <title>Fair Time - Chess with Bilateral Clock</title>
    <meta name="description" content="Chess with innovative Bilateral Clock: mutual tactical pauses by shared consent. Play online multiplayer or offline against Stockfish." />
    <meta name="keywords" content="chess, bilateral clock, mutual pause, online chess, multiplayer chess, play chess, fair time" />
    <meta name="author" content="bast933" />
